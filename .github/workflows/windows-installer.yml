# FountainTrade – Windows telepítő (Pester) ellenőrzés
#
# Csak akkor fut, ha a telepítő vagy annak tesztjei változnak. A Pester
# tesztek a régi (Pester 3.x) `Should Be` szintaxist használják, ezért a
# workflow kifejezetten a 3.4.0-s verziót biztosítja.
#
# Ez a workflow NEM része a kötelező "CI Gate" ellenőrzésnek: a telepítő
# tesztek a projekt dokumentációja szerint nem CI-kapuzó lépések.

name: Windows telepítő

on:
  pull_request:
    paths:
      - 'install-windows.ps1'
      - 'install-windows-lib.ps1'
      - 'tests/Install-WindowsTests.ps1'
      - '.github/workflows/windows-installer.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pester:
    name: Pester (install-windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Kód letöltése
        uses: actions/checkout@v4

      - name: Pester 3.4.0 biztosítása
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $legacy = Get-Module -ListAvailable Pester |
            Where-Object { $_.Version -ge [version]'3.4.0' -and $_.Version -lt [version]'4.0.0' }
          if (-not $legacy) {
            [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
            Install-PackageProvider -Name NuGet -Force -Scope CurrentUser -ErrorAction SilentlyContinue | Out-Null
            Install-Module Pester -RequiredVersion 3.4.0 -Force -Scope CurrentUser -SkipPublisherCheck -Confirm:$false
          }

      - name: Pester tesztek futtatása
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $result = Invoke-Pester -Script tests\Install-WindowsTests.ps1 -PassThru
          Write-Host ("Pester: {0} sikeres, {1} elbukott, {2} kihagyott" -f $result.PassedCount, $result.FailedCount, $result.SkippedCount)
          if ($result.FailedCount -gt 0) {
            throw "$($result.FailedCount) Pester teszt elbukott."
          }
