<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#22c55e">
<title>Nyugta</title>
<style>
:root {
    --bg: #0f172a; --panel: #1e293b; --text: #e2e8f0; --muted: #94a3b8;
    --accent: #22c55e; --danger: #ef4444; --border: #334155;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
.toolbar {
    display: flex; justify-content: center; gap: 10px; padding: 16px;
    background: var(--panel); border-bottom: 1px solid var(--border);
}
.btn {
    padding: 10px 18px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); cursor: pointer; font-size: 14px;
}
.btn.primary { background: var(--accent); color: #052e12; border: none; font-weight: 600; }
.receipt-wrap { display: flex; justify-content: center; padding: 30px 16px; }
.receipt {
    background: #fff; color: #111; width: 320px; padding: 20px;
    font-family: 'Courier New', monospace; font-size: 13px;
}
.receipt h2 { text-align: center; margin: 0 0 4px; font-size: 16px; }
.receipt .addr { text-align: center; color: #555; font-size: 12px; margin-bottom: 10px; }
.receipt hr { border: none; border-top: 1px dashed #999; margin: 8px 0; }
.line { display: flex; justify-content: space-between; font-size: 12px; margin: 2px 0; }
.item-name { font-size: 12px; margin-top: 6px; }
.total-line { display: flex; justify-content: space-between; font-weight: 700; font-size: 15px; margin-top: 6px; }
.footer-note { text-align: center; margin-top: 14px; font-size: 12px; color: #555; }
#feedback { text-align: center; font-size: 13px; margin-top: 10px; min-height: 18px; }
#feedback.error { color: var(--danger); }
#feedback.ok { color: var(--accent); }

@media print {
    .toolbar, #feedback { display: none; }
    body { background: #fff; }
    .receipt-wrap { padding: 0; }
    .receipt { width: 100%; }
}
</style>
</head>
<body>

<div class="toolbar">
    <button class="btn primary" onclick="window.print()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;vertical-align:-2px;margin-right:5px;"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>Nyomtatás (böngészőből)</button>
    <button class="btn" id="print-network-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;vertical-align:-2px;margin-right:5px;"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>Nyomtatás hálózati nyomtatóra</button>
</div>
<p id="feedback"></p>

<div class="receipt-wrap">
    <div class="receipt" id="receipt-content">Betöltés...</div>
</div>

<script src="receipt.js"></script>
</body>
</html>
